name: self-check

# Dogfoods please-bump against itself: any PR that touches the action's own
# implementation must bump ./VERSION. Uses `./` so the workflow always
# exercises the code actually on this PR, not a tagged release.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  please-bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./
